$kind: http-request
id: cd8e1733-1ec4-4830-a426-a892cbc90d22
description: Returns metadata about all organization fields in the company.
url: "{{baseUrl}}/organizationFields?include_fields=<string>,<string>&limit=<integer>&cursor=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: include_fields
    value: <string>,<string>
    description: Optional comma separated string array of additional data namespaces to include in response
  - key: limit
    value: <integer>
    description: For pagination, the limit of entries to be returned. If not provided, 100 items will be returned. Please note that a maximum value of 500 is allowed.
  - key: cursor
    value: <string>
    description: For pagination, the marker (an opaque string value) representing the first item on the next page
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Get all organization fields.resources/examples
order: 1000
