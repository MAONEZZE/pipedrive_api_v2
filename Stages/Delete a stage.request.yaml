$kind: http-request
id: 74290578-fd34-4152-9a31-d974acc8f539
description: Marks a stage as deleted.
url: "{{baseUrl}}/stages/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the stage
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Delete a stage.resources/examples
order: 3000
