$kind: http-request
id: d825ec28-db8a-4e77-b3cd-24d981125fd3
description: Updates the properties of a stage.
url: "{{baseUrl}}/stages/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the stage
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "pipeline_id": "<integer>",
      "deal_probability": "<integer>",
      "is_deal_rot_enabled": "<boolean>",
      "days_to_rotten": "<integer>"
    }
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Update stage details.resources/examples
order: 5000
