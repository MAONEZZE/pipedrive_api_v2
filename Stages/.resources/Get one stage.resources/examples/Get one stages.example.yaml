$kind: http-example
id: d9a5266b-a825-4d51-8708-bde47f1da16d
request:
  url: "{{baseUrl}}/stages/:id"
  method: GET
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the stage
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 1,
          "order_nr": 1,
          "name": "Stage Name",
          "is_deleted": false,
          "deal_probability": 100,
          "pipeline_id": 1,
          "is_deal_rot_enabled": true,
          "days_to_rotten": 2,
          "add_time": "2024-01-01T00:00:00Z",
          "update_time": "2024-01-01T00:00:00Z"
        }
      }
order: 1000
