$kind: http-example
id: 764724ab-0217-4ea3-a3aa-7b4e61951710
name: Deleted task.
request:
  url: "{{baseUrl}}/tasks/:id"
  method: DELETE
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the task
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 1
        },
        "additional_data": null
      }
order: 1000
