$kind: http-request
id: 211d4a75-b220-4303-9a65-6b0b7f1856a0
description: Returns the details of a specific task.
url: "{{baseUrl}}/tasks/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the task
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Get details of a task.resources/examples
order: 3000
