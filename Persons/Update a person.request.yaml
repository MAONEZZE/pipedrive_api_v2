$kind: http-request
id: d4e50aae-bc29-484d-a0a2-3d194fd28b2c
description: Updates the properties of a person. <br>If the company uses the [Campaigns product](https://pipedrive.readme.io/docs/campaigns-in-pipedrive-api), then this endpoint will also accept and return the `marketing_status` field. <br>The `im`, `postal_address`, `notes`, `birthday` and `job_title` fields don't exist by default in Pipedrive and are only created when you set up your contact sync — attempting to set any of them without contact sync enabled returns a 403.
url: "{{baseUrl}}/persons/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the person
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "owner_id": "<integer>",
      "org_id": "<integer>",
      "emails": [
        {
          "value": "<string>",
          "primary": "<boolean>",
          "label": "<string>"
        },
        {
          "value": "<string>",
          "primary": "<boolean>",
          "label": "<string>"
        }
      ],
      "phones": [
        {
          "value": "<string>",
          "primary": "<boolean>",
          "label": "<string>"
        },
        {
          "value": "<string>",
          "primary": "<boolean>",
          "label": "<string>"
        }
      ],
      "visible_to": "<integer>",
      "label_ids": [
        "<integer>",
        "<integer>"
      ],
      "postal_address": {
        "value": "<string>",
        "country": "<string>",
        "admin_area_level_1": "<string>",
        "admin_area_level_2": "<string>",
        "locality": "<string>",
        "sublocality": "<string>",
        "route": "<string>",
        "street_number": "<string>",
        "subpremise": "<string>",
        "postal_code": "<string>"
      },
      "notes": "<string>",
      "im": [
        {
          "value": "<string>",
          "primary": "<boolean>",
          "label": "<string>"
        },
        {
          "value": "<string>",
          "primary": "<boolean>",
          "label": "<string>"
        }
      ],
      "birthday": "<string>",
      "job_title": "<string>",
      "marketing_status": "<string>",
      "custom_fields": {
        "key_0": "string",
        "key_1": "string"
      }
    }
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Update a person.resources/examples
order: 5000
