$kind: http-request
id: 4509ea25-4e21-4885-bdfd-d37dc9b36902
description: Marks a person as deleted. After 30 days, the person will be permanently deleted.
url: "{{baseUrl}}/persons/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the person
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Delete a person.resources/examples
order: 3000
