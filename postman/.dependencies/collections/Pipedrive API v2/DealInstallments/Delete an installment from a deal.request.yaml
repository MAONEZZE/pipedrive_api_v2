$kind: http-request
id: f27677d8-6c1b-44bb-bf36-a5c73a3083a5
description: |
  Removes an installment from a deal.

  Only available in Growth and above plans.
url: "{{baseUrl}}/deals/:id/installments/:installment_id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the deal
  - key: installment_id
    value: <integer>
    description: (Required) The ID of the installment
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Delete an installment from a deal.resources/examples
order: 4000
