$kind: http-example
id: 4c88309b-25fb-4241-b1b2-7748e68af0cd
name: The ID of the deleted installment.
request:
  url: "{{baseUrl}}/deals/:id/installments/:installment_id"
  method: DELETE
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the deal
    - key: installment_id
      value: <integer>
      description: (Required) The ID of the installment
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 1
        }
      }
order: 1000
