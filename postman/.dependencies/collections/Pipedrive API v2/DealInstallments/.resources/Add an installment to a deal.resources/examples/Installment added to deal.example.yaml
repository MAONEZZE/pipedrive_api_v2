$kind: http-example
id: f1a004af-10fe-4872-ad5d-88ea0c063d85
request:
  url: "{{baseUrl}}/deals/:id/installments"
  method: POST
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the deal
  body:
    type: json
    content: |-
      {
        "description": "<string>",
        "amount": "<number>",
        "billing_date": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 1,
          "amount": 10,
          "billing_date": "2025-03-10",
          "deal_id": 1,
          "description": "Delivery Fee"
        }
      }
order: 1000
