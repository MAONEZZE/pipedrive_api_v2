$kind: http-request
id: 71081de1-0fad-4890-b857-25351a55b554
description: Returns the picture associated with a person. The picture URLs include both 128x128 and 512x512 pixel versions.
url: "{{baseUrl}}/persons/:id/picture"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the person
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Get picture of a person.resources/examples
order: 10000
