$kind: http-request
id: 1767798f-1011-48b6-80a0-62802691871f
description: Lists users who are following the person.
url: "{{baseUrl}}/persons/:id/followers?limit=<integer>&cursor=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: limit
    value: <integer>
    description: For pagination, the limit of entries to be returned. If not provided, 100 items will be returned. Please note that a maximum value of 500 is allowed.
  - key: cursor
    value: <string>
    description: For pagination, the marker (an opaque string value) representing the first item on the next page
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the person
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/List followers of a person.resources/examples
order: 6000
