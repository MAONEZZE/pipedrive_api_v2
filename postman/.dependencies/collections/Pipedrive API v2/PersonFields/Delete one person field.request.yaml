$kind: http-request
id: 37885348-33f8-4e2d-a32d-1305c17e4cc7
description: Marks a custom field as deleted.
url: "{{baseUrl}}/personFields/:field_code"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: field_code
    value: <string>
    description: (Required) The unique code identifying the field
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Delete one person field.resources/examples
order: 5000
