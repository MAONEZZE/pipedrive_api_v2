$kind: http-request
id: 7078b582-446b-47e6-ae2a-2b6856c2f166
description: Adds new options to a person custom field that supports options (enum or set field types). This operation is atomic - all options are added or none are added. Returns only the newly added options.
url: "{{baseUrl}}/personFields/:field_code/options"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: field_code
    value: <string>
    description: (Required) The unique code identifying the field
body:
  type: json
  content: |-
    [
      {
        "label": "<string>"
      },
      {
        "label": "<string>"
      }
    ]
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Add person field options in bulk.resources/examples
order: 6000
