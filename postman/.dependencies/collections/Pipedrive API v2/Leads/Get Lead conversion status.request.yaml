$kind: http-request
id: 8777617e-5cfd-4d39-a068-cc12bfb3755c
description: Returns data about the conversion. Status is always present and its value (not_started, running, completed, failed, rejected) represents the current state of the conversion. Deal ID is only present if the conversion was successfully finished. This data is only temporary and removed after a few days.
url: "{{baseUrl}}/leads/:id/convert/status/:conversion_id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <uuid>
    description: (Required) The ID of a lead
  - key: conversion_id
    value: <uuid>
    description: (Required) The ID of the conversion
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Get Lead conversion status.resources/examples
order: 3000
