$kind: http-example
id: 467487f2-fd77-4b3e-9e97-88d6f229a62d
request:
  url: "{{baseUrl}}/leads/:id/convert/deal"
  method: POST
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <uuid>
      description: (Required) The ID of the lead to convert
  body:
    type: json
    content: |-
      {
        "stage_id": "<integer>",
        "pipeline_id": "<integer>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "conversion_id": "4b40248b-945a-4802-b996-60fdff8c5c69"
        },
        "additional_data": null
      }
order: 1000
