$kind: http-request
id: 7c93ac52-e23f-4b39-9c78-8a866c28fd88
description: Returns metadata about a specific activity field.
url: "{{baseUrl}}/activityFields/:field_code?include_fields=<string>,<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: include_fields
    value: <string>,<string>
    description: Optional comma separated string array of additional data namespaces to include in response
pathVariables:
  - key: field_code
    value: <string>
    description: (Required) The unique code identifying the field
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Get one activity field.resources/examples
order: 2000
