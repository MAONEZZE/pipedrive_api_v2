$kind: http-request
id: c0fbc40f-d0c0-4c5f-a610-f7bb45c3be8e
description: Marks a task as deleted. If the task has subtasks, those will also be deleted.
url: "{{baseUrl}}/tasks/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the task
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Delete a task.resources/examples
order: 5000
