$kind: http-example
id: 5e731bef-c704-48b3-8b05-a2d76a6c1cc3
request:
  url: "{{baseUrl}}/pipelines/:id"
  method: DELETE
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the pipeline
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 1
        }
      }
order: 1000
