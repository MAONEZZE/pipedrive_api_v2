    - key: Accept
      value: application/json
  pathVariables:
    - key: field_code
      value: <string>
      description: (Required) The unique code identifying the field
  body:
    type: json
    content: |-
      [
        {
          "id": "<integer>",
          "label": "<string>"
        },
        {
          "id": "<integer>",
          "label": "<string>"
        }
      ]
response:
  statusCode: 200
  statusText: OK
  headers:
