$kind: http-request
id: 47a90577-ce3c-4acf-9406-ada9601a0f74
description: Marks a task as deleted. If the task has subtasks, those will also be deleted.
url: "{{baseUrl}}/tasks/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the task
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Delete a task.resources/examples
order: 14000
