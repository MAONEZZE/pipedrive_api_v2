$kind: http-request
id: 67bb12f8-900f-49d0-bdd2-4ffbc36e3438
description: Updates a project custom field. The field_code and field_type cannot be changed. At least one field must be provided in the request body.
url: "{{baseUrl}}/projectFields/:field_code"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: field_code
    value: <string>
    description: (Required) The unique code identifying the field
body:
  type: json
  content: |-
    {
      "field_name": "<string>",
      "ui_visibility": {
        "add_visible_flag": false,
        "details_visible_flag": true,
        "key_0": false,
        "key_1": true,
        "key_2": true,
        "key_3": false
      },
      "important_fields": {
        "enabled": false,
        "key_0": 8376
      },
      "required_fields": {
        "enabled": false,
        "key_0": 6241
      }
    }
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Update one project field.resources/examples
order: 4000
