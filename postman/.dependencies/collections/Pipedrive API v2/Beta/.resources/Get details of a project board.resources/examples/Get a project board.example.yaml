$kind: http-example
id: 3351f78d-6973-40ad-9c7e-1f64104eaf38
request:
  url: "{{baseUrl}}/boards/:id"
  method: GET
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the project board
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 1,
          "name": "Project Board",
          "order_nr": 1,
          "add_time": "2024-01-01T00:00:00.000Z",
          "update_time": "2024-01-01T00:00:00.000Z"
        }
      }
order: 1000
