$kind: http-request
id: 8d069357-62c0-4bf7-88f7-62fe04a756ef
description: Updates the properties of a project phase.
url: "{{baseUrl}}/phases/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the project phase
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "board_id": "<integer>",
      "order_nr": "<integer>"
    }
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Update a project phase.resources/examples
order: 23000
