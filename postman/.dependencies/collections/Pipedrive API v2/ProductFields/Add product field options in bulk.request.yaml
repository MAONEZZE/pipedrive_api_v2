$kind: http-request
id: efe3b2ac-3d33-4401-8d94-6062e7a432a8
description: Adds new options to a product custom field that supports options (enum or set field types). This operation is atomic - all options are added or none are added. Returns only the newly added options.
url: "{{baseUrl}}/productFields/:field_code/options"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: field_code
    value: <string>
    description: (Required) The unique code identifying the field
body:
  type: json
  content: |-
    [
      {
        "label": "<string>"
      },
      {
        "label": "<string>"
      }
    ]
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Add product field options in bulk.resources/examples
order: 6000
