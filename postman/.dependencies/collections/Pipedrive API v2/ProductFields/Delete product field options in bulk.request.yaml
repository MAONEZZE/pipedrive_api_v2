$kind: http-request
id: c7fc74c9-77b8-4789-9539-0e02ecbc1af2
description: Removes existing options from a product custom field. This operation is atomic and fails if any of the specified option IDs do not exist. Returns only the deleted options.
url: "{{baseUrl}}/productFields/:field_code/options"
method: DELETE
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: field_code
    value: <string>
    description: (Required) The unique code identifying the field
body:
  type: json
  content: |-
    [
      {
        "id": "<integer>"
      },
      {
        "id": "<integer>"
      }
    ]
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Delete product field options in bulk.resources/examples
order: 7000
