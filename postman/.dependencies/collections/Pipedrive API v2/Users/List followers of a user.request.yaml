$kind: http-request
id: 6cd8b1a7-af00-4d4d-be67-933aa93c3c2a
description: Lists users who are following the user.
url: "{{baseUrl}}/users/:id/followers?limit=<integer>&cursor=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: limit
    value: <integer>
    description: For pagination, the limit of entries to be returned. If not provided, 100 items will be returned. Please note that a maximum value of 500 is allowed.
  - key: cursor
    value: <string>
    description: For pagination, the marker (an opaque string value) representing the first item on the next page
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the user
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/List followers of a user.resources/examples
order: 1000
