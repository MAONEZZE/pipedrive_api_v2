$kind: http-request
id: 3cdfdc0d-e36e-4f0f-9a63-b0e976244165
description: Updates the properties of a project board.
url: "{{baseUrl}}/boards/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the project board
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "order_nr": "<integer>"
    }
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Update a project board.resources/examples
order: 4000
