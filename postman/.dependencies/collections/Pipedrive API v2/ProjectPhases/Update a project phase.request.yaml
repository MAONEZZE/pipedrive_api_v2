$kind: http-request
id: f9ea6028-4768-46f8-aa04-89d5c0684a0b
description: Updates the properties of a project phase.
url: "{{baseUrl}}/phases/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the project phase
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "board_id": "<integer>",
      "order_nr": "<integer>"
    }
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Update a project phase.resources/examples
order: 4000
