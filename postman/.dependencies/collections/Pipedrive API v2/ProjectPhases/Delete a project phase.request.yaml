$kind: http-request
id: c34fbec1-412b-4ac7-a693-831b5a203062
description: Marks a project phase as deleted.
url: "{{baseUrl}}/phases/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the project phase
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Delete a project phase.resources/examples
order: 5000
