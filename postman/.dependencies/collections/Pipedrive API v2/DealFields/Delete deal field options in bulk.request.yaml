$kind: http-request
id: 3f874de3-54df-4c16-aa5b-4252933ac338
description: Removes existing options from a deal custom field. This operation is atomic and fails if any of the specified option IDs do not exist. Returns only the deleted options.
url: "{{baseUrl}}/dealFields/:field_code/options"
method: DELETE
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: field_code
    value: <string>
    description: (Required) The unique code identifying the field
body:
  type: json
  content: |-
    [
      {
        "id": "<integer>"
      },
      {
        "id": "<integer>"
      }
    ]
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Delete deal field options in bulk.resources/examples
order: 7000
