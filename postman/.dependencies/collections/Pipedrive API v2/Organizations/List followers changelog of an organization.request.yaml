$kind: http-request
id: ce4463b6-e2c0-4a62-a214-b8c939aecd14
description: Lists changelogs about users have followed the organization.
url: "{{baseUrl}}/organizations/:id/followers/changelog?limit=<integer>&cursor=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: limit
    value: <integer>
    description: For pagination, the limit of entries to be returned. If not provided, 100 items will be returned. Please note that a maximum value of 500 is allowed.
  - key: cursor
    value: <string>
    description: For pagination, the marker (an opaque string value) representing the first item on the next page
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the organization
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/List followers changelog of an organization.resources/examples
order: 8000
