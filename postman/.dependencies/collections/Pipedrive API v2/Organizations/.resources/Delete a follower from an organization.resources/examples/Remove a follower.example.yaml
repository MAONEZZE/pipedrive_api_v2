$kind: http-example
id: 69500210-0664-483a-ad15-a25663c813eb
request:
  url: "{{baseUrl}}/organizations/:id/followers/:follower_id"
  method: DELETE
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the organization
    - key: follower_id
      value: <integer>
      description: (Required) The ID of the following user
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "user_id": 1
        }
      }
order: 1000
