$kind: http-request
id: 53705f93-7c47-4fab-8815-5e03cdfcb6b7
description: Returns data about a specific stage.
url: "{{baseUrl}}/stages/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the stage
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Get one stage.resources/examples
order: 4000
