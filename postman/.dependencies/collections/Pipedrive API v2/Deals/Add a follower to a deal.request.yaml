$kind: http-request
id: 7717b785-9d93-4e19-a917-8b47e33c95ed
description: Adds a user as a follower to the deal.
url: "{{baseUrl}}/deals/:id/followers"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the deal
body:
  type: json
  content: |-
    {
      "user_id": "<integer>"
    }
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Add a follower to a deal.resources/examples
order: 8000
