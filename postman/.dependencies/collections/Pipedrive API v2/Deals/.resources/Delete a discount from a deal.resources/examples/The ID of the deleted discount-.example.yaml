$kind: http-example
id: 56599e8d-f571-4c8f-8448-106e3960ff61
name: The ID of the deleted discount.
request:
  url: "{{baseUrl}}/deals/:id/discounts/:discount_id"
  method: DELETE
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the deal
    - key: discount_id
      value: <uuid>
      description: (Required) The ID of the discount
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 123
        }
      }
order: 1000
