$kind: http-example
id: 3601512e-8593-4a15-b045-cb8b046114f3
name: Edited discount.
request:
  url: "{{baseUrl}}/deals/:id/discounts/:discount_id"
  method: PATCH
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the deal
    - key: discount_id
      value: <uuid>
      description: (Required) The ID of the discount
  body:
    type: json
    content: |-
      {
        "description": "<string>",
        "amount": "<number>",
        "type": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": "30195b0e-7577-4f52-a5cf-f3ee39b9d1e0",
          "description": "10%",
          "amount": 10,
          "type": "percentage",
          "deal_id": 1,
          "created_at": "2024-03-12T10:30:05Z",
          "created_by": 1,
          "updated_at": "2024-03-12T10:30:05Z",
          "updated_by": 1
        }
      }
order: 1000
