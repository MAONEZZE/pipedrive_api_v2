  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": "30195b0e-7577-4f52-a5cf-f3ee39b9d1e0",
          "description": "10%",
          "amount": 10,
          "type": "percentage",
          "deal_id": 1,
          "created_at": "2024-03-12T10:30:05Z",
          "created_by": 1,
          "updated_at": "2024-03-12T10:30:05Z",
          "updated_by": 1
        }
      }
