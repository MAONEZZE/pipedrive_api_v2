request:
  url: "{{baseUrl}}/deals/:id/discounts"
  method: POST
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the deal
  body:
    type: json
    content: |-
      {
        "description": "<string>",
        "amount": "<number>",
        "type": "<string>"
      }
