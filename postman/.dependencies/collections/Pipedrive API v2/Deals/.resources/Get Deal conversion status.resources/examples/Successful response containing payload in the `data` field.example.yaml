$kind: http-example
id: 2fb9aae3-3d74-4865-b2ed-054e2f90e94a
request:
  url: "{{baseUrl}}/deals/:id/convert/status/:conversion_id"
  method: GET
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of a deal
    - key: conversion_id
      value: <uuid>
      description: (Required) The ID of the conversion
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "lead_id": "9f3e6e50-9d99-11ee-9538-29c81a92c0d1",
          "conversion_id": "4b40248b-945a-4802-b996-60fdff8c5c69",
          "status": "completed"
        },
        "additional_data": null
      }
order: 1000
