$kind: http-example
id: acac36ea-30d2-4923-9428-66407702d6c1
request:
  url: "{{baseUrl}}/deals/:id/convert/lead"
  method: POST
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the deal to convert
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "conversion_id": "4b40248b-945a-4802-b996-60fdff8c5c69"
        },
        "additional_data": null
      }
order: 1000
