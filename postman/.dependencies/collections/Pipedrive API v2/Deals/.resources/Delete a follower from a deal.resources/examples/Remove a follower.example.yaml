$kind: http-example
id: e55f6b7c-9576-40e4-a7c4-ec97361e6d39
request:
  url: "{{baseUrl}}/deals/:id/followers/:follower_id"
  method: DELETE
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the deal
    - key: follower_id
      value: <integer>
      description: (Required) The ID of the following user
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "user_id": 1
        }
      }
order: 1000
