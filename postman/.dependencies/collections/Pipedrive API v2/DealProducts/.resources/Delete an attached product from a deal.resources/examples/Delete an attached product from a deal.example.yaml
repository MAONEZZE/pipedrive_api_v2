$kind: http-example
id: 7022eea4-d60a-4871-8676-9f4e1c303649
request:
  url: "{{baseUrl}}/deals/:id/products/:product_attachment_id"
  method: DELETE
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the deal
    - key: product_attachment_id
      value: <integer>
      description: (Required) The product attachment ID
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 123
        }
      }
order: 1000
