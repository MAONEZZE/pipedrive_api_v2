$kind: http-request
id: ea8f8013-6ab4-4fc9-8d77-e2a92d2b337c
description: Updates the image of a product.
url: "{{baseUrl}}/products/:id/images"
method: PUT
headers:
  Content-Type: multipart/form-data
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the product
body:
  type: formdata
  content:
    - type: file
      key: data
      src: []
      description: (Required) One image supplied in the multipart/form-data encoding
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Update an image for a product.resources/examples
order: 18000
