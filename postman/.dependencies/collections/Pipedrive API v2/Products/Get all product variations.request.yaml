$kind: http-request
id: 55693be9-c27f-475d-9707-99ece6d116ce
description: Returns data about all product variations.
url: "{{baseUrl}}/products/:id/variations?cursor=<string>&limit=<integer>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: cursor
    value: <string>
    description: For pagination, the marker (an opaque string value) representing the first item on the next page
  - key: limit
    value: <integer>
    description: For pagination, the limit of entries to be returned. If not provided, 100 items will be returned. Please note that a maximum value of 500 is allowed.
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the product
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Get all product variations.resources/examples
order: 12000
