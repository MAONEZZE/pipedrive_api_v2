$kind: http-request
id: 3dfd0f75-b96c-472a-8dfd-dc8b60befd31
description: Marks a product as deleted. After 30 days, the product will be permanently deleted.
url: "{{baseUrl}}/products/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the product
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Delete a product.resources/examples
order: 8000
