$kind: http-example
id: 74eb00ea-cb41-4ffd-acb6-8ef3d52b3d82
request:
  url: "{{baseUrl}}/products/:id/followers"
  method: POST
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the product
  body:
    type: json
    content: |-
      {
        "user_id": "<integer>"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "user_id": 1,
          "add_time": "2021-01-01T00:00:00Z"
        }
      }
order: 1000
