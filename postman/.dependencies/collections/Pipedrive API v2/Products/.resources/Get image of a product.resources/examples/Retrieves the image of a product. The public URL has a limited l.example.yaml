$kind: http-example
id: 4a74bc2a-e8d1-4608-881e-45d6d6130c16
name: Retrieves the image of a product. The public URL has a limited lifetime of 7 days.
request:
  url: "{{baseUrl}}/products/:id/images"
  method: GET
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the product
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 1,
          "product_id": 1,
          "company_id": "1",
          "public_url": "http://my-server.com/images/b0369d1d-6b6a-4293-88b9-e2924782d47e.png",
          "add_time": "2025-03-10",
          "mime_type": "image/png",
          "name": "product-image.png"
        }
      }
order: 1000
