$kind: http-example
id: aecf7fc9-8b24-47fb-bf4f-638e86234772
request:
  url: "{{baseUrl}}/products/:id/followers/changelog?limit=100&cursor=<string>"
  method: GET
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  queryParams:
    limit: "100"
    cursor: <string>
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the product
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": [
          {
            "action": "added",
            "actor_user_id": 1,
            "follower_user_id": 1,
            "time": "2024-01-01T00:00:00Z"
          }
        ],
        "additional_data": {
          "next_cursor": "eyJmaWVsZCI6ImlkIiwiZmllbGRWYWx1ZSI6Nywic29ydERpcmVjdGlvbiI6ImFzYyIsImlkIjo3fQ"
        }
      }
order: 1000
