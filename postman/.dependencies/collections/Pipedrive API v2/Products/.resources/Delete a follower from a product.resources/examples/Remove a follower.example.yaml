$kind: http-example
id: c0084ee2-9ab3-4291-b674-bed89df720d8
request:
  url: "{{baseUrl}}/products/:id/followers/:follower_id"
  method: DELETE
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the product
    - key: follower_id
      value: <integer>
      description: (Required) The ID of the following user
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "user_id": 1
        }
      }
order: 1000
