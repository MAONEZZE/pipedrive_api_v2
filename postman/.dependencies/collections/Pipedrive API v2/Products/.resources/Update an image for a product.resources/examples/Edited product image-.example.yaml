$kind: http-example
id: c1e46726-4698-4038-83b1-95eb10d3857e
name: Edited product image.
request:
  url: "{{baseUrl}}/products/:id/images"
  method: PUT
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the product
  body:
    type: formdata
    content:
      - type: text
        key: data
        value: <binary>
        description: (Required) One image supplied in the multipart/form-data encoding
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 1,
          "product_id": 1,
          "company_id": "1",
          "add_time": "2025-03-10"
        }
      }
order: 1000
