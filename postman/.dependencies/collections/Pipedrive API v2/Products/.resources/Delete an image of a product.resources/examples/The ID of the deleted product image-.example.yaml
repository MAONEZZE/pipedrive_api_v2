$kind: http-example
id: ef84fca8-5c4f-4244-a7b3-f7a2b55f8017
name: The ID of the deleted product image.
request:
  url: "{{baseUrl}}/products/:id/images"
  method: DELETE
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the product
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 1
        }
      }
order: 1000
