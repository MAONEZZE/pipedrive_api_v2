$kind: http-example
id: c1836795-09d9-4208-ac16-f90b5a426883
request:
  url: "{{baseUrl}}/products/:id/variations?cursor=<string>&limit=100"
  method: GET
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  queryParams:
    cursor: <string>
    limit: "100"
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the product
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": [
          {
            "id": 2,
            "name": "Upgraded Mechanical Pencil",
            "product_id": 1,
            "prices": [
              {
                "product_variation_id": 2,
                "price": 5,
                "currency": "EUR",
                "cost": 2,
                "direct_cost": 3,
                "notes": "This is the price for the upgraded mechanical pencil"
              }
            ]
          }
        ],
        "additional_data": {
          "next_cursor": "eyJmaWVsZCI6ImlkIiwiZmllbGRWYWx1ZSI6Nywic29ydERpcmVjdGlvbiI6ImFzYyIsImlkIjo3fQ"
        }
      }
order: 1000
