$kind: http-example
id: d9bf56e7-0e01-4b46-93d0-15f448205384
request:
  url: "{{baseUrl}}/products/:id/variations"
  method: POST
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the product
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "prices": [
          "<object>",
          "<object>"
        ]
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 2,
          "name": "Upgraded Mechanical Pencil",
          "product_id": 1,
          "prices": [
            {
              "product_variation_id": 2,
              "price": 5,
              "currency": "EUR",
              "cost": 2,
              "direct_cost": 3,
              "notes": "This is the price for the upgraded mechanical pencil"
            }
          ]
        }
      }
order: 1000
