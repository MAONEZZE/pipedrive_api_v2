$kind: http-request
id: 7b37e08f-f224-4376-abbd-543b001c29ff
description: Retrieves the image of a product. The public URL has a limited lifetime of 7 days.
url: "{{baseUrl}}/products/:id/images"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the product
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Get image of a product.resources/examples
order: 16000
