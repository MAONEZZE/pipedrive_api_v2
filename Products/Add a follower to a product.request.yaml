$kind: http-request
id: a6d2c8de-9221-488f-9831-180b9a2a7c2b
description: Adds a user as a follower to the product.
url: "{{baseUrl}}/products/:id/followers"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the product
body:
  type: json
  content: |-
    {
      "user_id": "<integer>"
    }
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Add a follower to a product.resources/examples
order: 4000
