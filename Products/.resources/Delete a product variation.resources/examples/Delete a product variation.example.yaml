$kind: http-example
id: 2e1f6e3b-08c5-48c7-b86a-9716507dad92
request:
  url: "{{baseUrl}}/products/:id/variations/:product_variation_id"
  method: DELETE
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the product
    - key: product_variation_id
      value: <integer>
      description: (Required) The ID of the product variation
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 123
        }
      }
order: 1000
