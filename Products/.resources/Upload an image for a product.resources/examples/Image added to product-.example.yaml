$kind: http-example
id: b808aeeb-a48b-4331-8149-4b70a4106c97
name: Image added to product.
request:
  url: "{{baseUrl}}/products/:id/images"
  method: POST
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the product
  body:
    type: formdata
    content:
      - type: text
        key: data
        value: <binary>
        description: (Required) One image supplied in the multipart/form-data encoding
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 1,
          "product_id": 1,
          "company_id": "1",
          "add_time": "2025-03-10"
        }
      }
order: 1000
