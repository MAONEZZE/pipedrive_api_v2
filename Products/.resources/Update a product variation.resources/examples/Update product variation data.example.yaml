$kind: http-example
id: 6bd3349d-65da-40c5-9410-21d8dfd33321
request:
  url: "{{baseUrl}}/products/:id/variations/:product_variation_id"
  method: PATCH
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the product
    - key: product_variation_id
      value: <integer>
      description: (Required) The ID of the product variation
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "prices": [
          "<object>",
          "<object>"
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 2,
          "name": "Upgraded Mechanical Pencil",
          "product_id": 1,
          "prices": [
            {
              "product_variation_id": 2,
              "price": 5,
              "currency": "EUR",
              "cost": 2,
              "direct_cost": 3,
              "notes": "This is the price for the upgraded mechanical pencil"
            }
          ]
        }
      }
order: 1000
