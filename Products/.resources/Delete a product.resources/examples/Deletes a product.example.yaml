$kind: http-example
id: 9f275921-6113-4a47-94d8-e51d2addd701
request:
  url: "{{baseUrl}}/products/:id"
  method: DELETE
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the product
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 1
        }
      }
order: 1000
