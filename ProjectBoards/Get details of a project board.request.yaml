$kind: http-request
id: f08c1d7a-86b9-4137-a7a7-8f3e92711b3e
description: Returns the details of a specific project board.
url: "{{baseUrl}}/boards/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the project board
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Get details of a project board.resources/examples
order: 3000
