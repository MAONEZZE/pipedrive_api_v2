$kind: http-example
id: f33d24cd-cf8e-4ab9-85a1-4aab2f32c1e9
request:
  url: "{{baseUrl}}/phases/:id"
  method: PATCH
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the project phase
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "board_id": "<integer>",
        "order_nr": "<integer>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 2,
          "name": "Project Phase",
          "board_id": 1,
          "order_nr": 1,
          "add_time": "2024-01-01T00:00:00.000Z",
          "update_time": "2024-01-01T00:00:00.000Z"
        }
      }
order: 1000
