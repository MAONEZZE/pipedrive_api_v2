$kind: http-example
id: 99335bf4-051a-4378-a7f1-22ec550587b2
request:
  url: "{{baseUrl}}/phases/:id"
  method: GET
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the project phase
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 2,
          "name": "Project Phase",
          "board_id": 1,
          "order_nr": 1,
          "add_time": "2024-01-01T00:00:00.000Z",
          "update_time": "2024-01-01T00:00:00.000Z"
        }
      }
order: 1000
