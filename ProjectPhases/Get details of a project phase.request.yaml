$kind: http-request
id: ed3fc45b-82b9-4c58-9a80-9482855ff2cf
description: Returns the details of a specific project phase.
url: "{{baseUrl}}/phases/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the project phase
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Get details of a project phase.resources/examples
order: 3000
