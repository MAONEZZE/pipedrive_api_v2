$kind: http-request
id: 61e1ac56-b22d-41ca-955a-5ffff3956bb3
description: Removes existing options from a project custom field. This operation is atomic and fails if any of the specified option IDs do not exist. Returns only the deleted options.
url: "{{baseUrl}}/projectFields/:field_code/options"
method: DELETE
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: field_code
    value: <string>
    description: (Required) The unique code identifying the field
body:
  type: json
  content: |-
    [
      {
        "id": "<integer>"
      },
      {
        "id": "<integer>"
      }
    ]
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Delete project field options in bulk.resources/examples
order: 7000
