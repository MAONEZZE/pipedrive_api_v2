$kind: http-request
id: 8c36fe22-e085-4cd6-9b62-acff0d81719c
description: Updates a task.
url: "{{baseUrl}}/tasks/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the task
body:
  type: json
  content: |-
    {
      "title": "<string>",
      "project_id": "<integer>",
      "parent_task_id": "<integer>",
      "description": "<string>",
      "done": "<integer>",
      "milestone": "<integer>",
      "due_date": "<date>",
      "start_date": "<date>",
      "assignee_id": "<integer>",
      "assignee_ids": [
        "<integer>",
        "<integer>"
      ],
      "priority": "<integer>"
    }
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Update a task.resources/examples
order: 13000
