$kind: http-request
id: 55cb5792-1b8c-49fa-990f-03fde0d6651b
description: Updates existing options for a project custom field. This operation is atomic and fails if any of the specified option IDs do not exist. Returns only the updated options.
url: "{{baseUrl}}/projectFields/:field_code/options"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: field_code
    value: <string>
    description: (Required) The unique code identifying the field
body:
  type: json
  content: |-
    [
      {
        "id": "<integer>",
        "label": "<string>"
      },
      {
        "id": "<integer>",
        "label": "<string>"
      }
    ]
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Update project field options in bulk.resources/examples
order: 8000
