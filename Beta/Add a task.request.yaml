$kind: http-request
id: 06aa6d66-413a-4f7b-b67e-a46050cc2c95
description: Adds a new task.
url: "{{baseUrl}}/tasks"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "title": "<string>",
      "project_id": "<integer>",
      "parent_task_id": "<integer>",
      "description": "<string>",
      "done": "<integer>",
      "milestone": "<integer>",
      "due_date": "<date>",
      "start_date": "<date>",
      "assignee_id": "<integer>",
      "assignee_ids": [
        "<integer>",
        "<integer>"
      ],
      "priority": "<integer>"
    }
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Add a task.resources/examples
order: 11000
