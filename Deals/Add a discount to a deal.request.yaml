$kind: http-request
id: aef5d766-2273-4ed7-ab34-6f59c30645cd
description: Adds a discount to a deal, changing the deal value if the deal has one-time products attached.
url: "{{baseUrl}}/deals/:id/discounts"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the deal
body:
  type: json
  content: |-
    {
      "description": "<string>",
      "amount": "<number>",
      "type": "<string>"
    }
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Add a discount to a deal.resources/examples
order: 13000
