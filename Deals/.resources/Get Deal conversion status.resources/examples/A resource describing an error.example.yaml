$kind: http-example
id: 676b86ea-cfeb-48f4-b622-29c7e9f5d0da
request:
  url: "{{baseUrl}}/deals/:id/convert/status/:conversion_id"
  method: GET
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of a deal
    - key: conversion_id
      value: <uuid>
      description: (Required) The ID of the conversion
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "error": "Entity was not found",
        "error_info": "Object was not found.",
        "data": null,
        "additional_data": null
      }
order: 2000
