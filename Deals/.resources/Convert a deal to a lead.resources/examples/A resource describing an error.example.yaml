$kind: http-example
id: d071bae3-4087-4209-b17c-07f9ca304cad
request:
  url: "{{baseUrl}}/deals/:id/convert/lead"
  method: POST
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the deal to convert
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "error": "Entity was not found",
        "error_info": "Object was not found.",
        "data": null,
        "additional_data": null
      }
order: 2000
