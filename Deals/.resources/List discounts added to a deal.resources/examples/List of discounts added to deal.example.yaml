$kind: http-example
id: 9a765aef-31af-4901-9dd1-006d61bf5cd3
request:
  url: "{{baseUrl}}/deals/:id/discounts"
  method: GET
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the deal
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": [
          {
            "id": "30195b0e-7577-4f52-a5cf-f3ee39b9d1e0",
            "description": "10%",
            "amount": 10,
            "type": "percentage",
            "deal_id": 1,
            "created_at": "2024-03-12T10:30:05Z",
            "created_by": 1,
            "updated_at": "2024-03-12T10:30:05Z",
            "updated_by": 1
          }
        ]
      }
order: 1000
