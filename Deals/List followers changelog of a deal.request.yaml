$kind: http-request
id: 6ad1033f-edfc-4b02-97af-543c4c858795
description: Lists changelogs about users have followed the deal.
url: "{{baseUrl}}/deals/:id/followers/changelog?limit=<integer>&cursor=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: limit
    value: <integer>
    description: For pagination, the limit of entries to be returned. If not provided, 100 items will be returned. Please note that a maximum value of 500 is allowed.
  - key: cursor
    value: <string>
    description: For pagination, the marker (an opaque string value) representing the first item on the next page
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the deal
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/List followers changelog of a deal.resources/examples
order: 9000
