$kind: http-request
id: b2025241-374e-4a06-b3ab-c76589bca68f
description: Edits a discount added to a deal, changing the deal value if the deal has one-time products attached.
url: "{{baseUrl}}/deals/:id/discounts/:discount_id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the deal
  - key: discount_id
    value: <uuid>
    description: (Required) The ID of the discount
body:
  type: json
  content: |-
    {
      "description": "<string>",
      "amount": "<number>",
      "type": "<string>"
    }
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Update a discount added to a deal.resources/examples
order: 14000
