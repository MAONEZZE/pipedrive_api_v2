      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: field_code
      value: <string>
      description: (Required) The unique code identifying the field
  body:
    type: json
    content: |-
      [
        {
          "id": "<integer>"
        },
        {
          "id": "<integer>"
        }
      ]
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": [
          {
            "id": 4,
            "label": "Critical"
          }
        ],
        "additional_data": null
      }
