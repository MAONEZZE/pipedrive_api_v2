$kind: http-example
id: fdff0786-a584-489e-919b-9f47de145ba2
request:
  url: "{{baseUrl}}/pipelines/:id"
  method: GET
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the pipeline
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 1,
          "name": "Pipeline Name",
          "order_nr": 1,
          "is_deleted": false,
          "is_deal_probability_enabled": true,
          "add_time": "2024-01-01T00:00:00Z",
          "update_time": "2024-01-01T00:00:00Z"
        }
      }
order: 1000
