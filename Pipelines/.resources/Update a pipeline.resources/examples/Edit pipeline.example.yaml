$kind: http-example
id: b01a8bf9-56d9-453e-8fe4-03b54453a7b5
request:
  url: "{{baseUrl}}/pipelines/:id"
  method: PATCH
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the pipeline
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "is_deal_probability_enabled": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 1,
          "name": "Pipeline Name",
          "order_nr": 1,
          "is_deleted": false,
          "is_deal_probability_enabled": true,
          "add_time": "2024-01-01T00:00:00Z",
          "update_time": "2024-01-01T00:00:00Z"
        }
      }
order: 1000
