$kind: http-request
id: 2dd57307-1bb3-47fc-b54d-2da6fc2b95ca
description: Marks a pipeline as deleted.
url: "{{baseUrl}}/pipelines/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) The ID of the pipeline
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Delete a pipeline.resources/examples
order: 3000
