      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  queryParams:
    ids: 1,2,3
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the deal
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "ids": [
            1,
            2,
            3
          ]
        },
        "additional_data": {
          "more_items_in_collection": false
        }
      }
