request:
  url: "{{baseUrl}}/deals/:id/products"
  method: POST
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the deal
  body:
    type: json
    content: |-
      {
        "item_price": "<number>",
        "quantity": "<number>",
        "product_id": "<integer>",
        "tax": 0,
        "comments": "<string>",
        "discount": 0,
        "is_enabled": true,
        "tax_method": "<string>",
        "discount_type": "percentage",
        "product_variation_id": "<integer>",
        "billing_frequency": "one-time",
        "billing_frequency_cycles": null,
        "billing_start_date": null
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 3,
