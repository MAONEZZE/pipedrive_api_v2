$kind: http-example
id: 102bce48-d599-4d77-9358-5cb3dcfc785d
name: Get a project template.
request:
  url: "{{baseUrl}}/projectTemplates/:id"
  method: GET
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the project template
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 1,
          "title": "Office Renovation",
          "description": "Template for office renovation projects",
          "projects_board_id": 2,
          "owner_id": 3,
          "add_time": "2023-09-14T08:14:40.000Z",
          "update_time": "2023-09-14T08:14:40.000Z"
        },
        "additional_data": null
      }
order: 1000
