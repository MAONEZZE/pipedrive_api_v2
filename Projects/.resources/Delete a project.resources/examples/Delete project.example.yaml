$kind: http-example
id: 4f5ecea7-6eb6-45d5-8ce6-53e37d1719d3
request:
  url: "{{baseUrl}}/projects/:id"
  method: DELETE
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the project
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": 3
        }
      }
order: 1000
