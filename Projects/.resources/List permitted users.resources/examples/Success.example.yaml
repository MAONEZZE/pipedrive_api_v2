$kind: http-example
id: 6fb9e411-7a99-4db3-8aac-0ce58c306cb0
request:
  url: "{{baseUrl}}/projects/:id/permittedUsers"
  method: GET
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <integer>
      description: (Required) The ID of the project
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": [
          123,
          456
        ]
      }
order: 1000
