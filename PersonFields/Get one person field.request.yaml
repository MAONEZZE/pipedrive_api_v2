$kind: http-request
id: 69538f28-0db2-4a6f-8794-8021efcdb24b
description: Returns metadata about a specific person field.
url: "{{baseUrl}}/personFields/:field_code?include_fields=<string>,<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: include_fields
    value: <string>,<string>
    description: Optional comma separated string array of additional data namespaces to include in response
pathVariables:
  - key: field_code
    value: <string>
    description: (Required) The unique code identifying the field
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Get one person field.resources/examples
order: 3000
