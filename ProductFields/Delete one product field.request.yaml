$kind: http-request
id: 2e234139-4551-4b37-b558-fe8dcb4742a2
description: Marks a custom field as deleted.
url: "{{baseUrl}}/productFields/:field_code"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: field_code
    value: <string>
    description: (Required) The unique code identifying the field
auth:
  type: apikey
  credentials:
    key: x-api-token
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Delete one product field.resources/examples
order: 5000
