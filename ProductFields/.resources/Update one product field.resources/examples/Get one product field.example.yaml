$kind: http-example
id: 14bc68b5-90a5-4a34-95d1-2ee91f077221
request:
  url: "{{baseUrl}}/productFields/:field_code"
  method: PATCH
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: field_code
      value: <string>
      description: (Required) The unique code identifying the field
  body:
    type: json
    content: |-
      {
        "field_name": "<string>",
        "ui_visibility": {
          "add_visible_flag": false,
          "details_visible_flag": true
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "field_name": "Product Name",
          "field_code": "name",
          "field_type": "varchar",
          "options": null,
          "subfields": null,
          "is_custom_field": false,
          "is_optional_response_field": false,
          "ui_visibility": {
            "add_visible_flag": true,
            "details_visible_flag": true
          }
        }
      }
order: 1000
