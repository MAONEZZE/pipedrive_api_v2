$kind: http-example
id: 43c2ea85-9f08-4595-b9e3-cd72f9f82e54
request:
  url: "{{baseUrl}}/leads/:id/convert/status/:conversion_id"
  method: GET
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <uuid>
      description: (Required) The ID of a lead
    - key: conversion_id
      value: <uuid>
      description: (Required) The ID of the conversion
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "deal_id": 33,
          "conversion_id": "4b40248b-945a-4802-b996-60fdff8c5c69",
          "status": "completed"
        },
        "additional_data": null
      }
order: 1000
