$kind: http-example
id: 65eab047-2ddb-41c3-8a67-39234ff960bc
request:
  url: "{{baseUrl}}/leads/:id/convert/deal"
  method: POST
  headers:
    - key: x-api-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: <uuid>
      description: (Required) The ID of the lead to convert
  body:
    type: json
    content: |-
      {
        "stage_id": "<integer>",
        "pipeline_id": "<integer>"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "error": "Entity was not found",
        "error_info": "Object was not found.",
        "data": null,
        "additional_data": null
      }
order: 2000
